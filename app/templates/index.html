<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Versado Audio Worker</title><link rel="stylesheet" href="/static/style.css"></head><body><header><div><small>VERSADO</small><h1>Audio Worker</h1><p>Een rustige plek voor de juiste stem.</p></div><button id="logout" hidden>Afmelden</button></header><main><section id="login" class="card"><h2>Welkom terug</h2><form id="loginform"><label>Wachtwoord<input id="password" type="password" required autocomplete="current-password"></label><button>Aanmelden</button></form></section><div id="workspace" hidden><section class="card selector"><div><label>Spraakmodel<select id="engine"><option value="piper">Piper</option><option value="supertonic">Supertonic 3</option></select></label></div><div><label>Stem<select id="voice"></select></label></div><div><label>Schriftbron<select id="source"><option value="bofm">Boek van Mormon</option><option value="bible">Bijbel</option></select></label></div></section><nav><button data-tab="lab">Voice Lab</button><button data-tab="dictionary">Uitspraakwoordenboek</button></nav><p id="message" role="status"></p><section id="lab"><div class="card"><h2>Maak een proefopname</h2><form id="generate"><label>Tekst<textarea id="text" rows="7" maxlength="20000" required placeholder="Typ hier de tekst die je wilt beluisteren…"></textarea></label><label>Label <input id="label" maxlength="200" placeholder="Bijvoorbeeld: rustige vertelling"></label><button>Genereer audio</button></form></div><h2>Opnamen vergelijken</h2><div id="jobs"></div></section><section id="dictionary" hidden><div class="card"><h2>Uitspraakwoordenboek</h2><p>Nieuwe en gewijzigde uitspraken zijn voorstellen totdat je ze goedkeurt.</p><input id="search" placeholder="Zoek een woord" aria-label="Zoek een woord"><form id="ruleform"><input type="hidden" id="ruleid"><label>Origineel<input id="original" required maxlength="120"></label><label>Gewenste uitspraak<input id="replacement" required maxlength="120"></label><label>Toelichting<input id="note" maxlength="1000"></label><button>Voorstel opslaan</button><button type="button" id="clear">Wissen</button></form></div><div id="rules"></div></section></div></main><script src="/static/app.js" defer></script></body></html>
