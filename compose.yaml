name: versado-audio-worker
services:
  voice-lab:
    image: ghcr.io/rjgout/versado-audio-worker:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:5006:5006"
    environment:
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY vereist}
      PASSWORD_HASH: ${PASSWORD_HASH:?PASSWORD_HASH vereist}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PIPER_HOST: piper
      SUPERTONIC_URL: http://supertonic:8000
      WHISPER_URL: http://whisper:8090
      WHISPER_TIMEOUT: ${WHISPER_TIMEOUT:-7200}
    volumes:
      - ${NAS_ROOT:-/volume2/docker/versado-audio-worker}/models:/data/models:ro
      - ${NAS_ROOT:-/volume2/docker/versado-audio-worker}/tests:/data/tests
      - ${NAS_ROOT:-/volume2/docker/versado-audio-worker}/pronunciation:/data/pronunciation
    mem_limit: ${APP_MEMORY:-512m}
    networks: [internal]
  piper:
    image: ghcr.io/rjgout/versado-audio-worker-piper:${PIPER_IMAGE_TAG:-latest}
    restart: unless-stopped
    command: ["--voice", "nl_NL-ronnie-medium", "--data-dir", "/data", "--download-dir", "/data", "--uri", "tcp://0.0.0.0:10200", "--local-files-only"]
    volumes:
      - ${NAS_ROOT:-/volume2/docker/versado-audio-worker}/models:/data
    mem_limit: ${PIPER_MEMORY:-2g}
    networks: [internal]
  supertonic:
    image: k8bit/supertonic:latest
    restart: unless-stopped
    volumes:
      - ${NAS_ROOT:-/volume2/docker/versado-audio-worker}/supertonic-models:/models
    environment:
      SUPERTONIC_MODEL: supertonic-3
    mem_limit: ${SUPERTONIC_MEMORY:-4g}
    networks: [internal]
  whisper:
    image: ghcr.io/rjgout/versado-audio-worker-whisper:${WHISPER_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      WHISPER_THREADS: ${WHISPER_THREADS:-2}
      WHISPER_TIMEOUT: ${WHISPER_TIMEOUT:-7200}
    volumes:
      - ${NAS_ROOT:-/volume2/docker/versado-audio-worker}/whisper-models:/models:ro
      - ${NAS_ROOT:-/volume2/docker/versado-audio-worker}/pronunciation:/coord
    mem_limit: ${WHISPER_MEMORY:-3g}
    networks: [internal]
networks:
  internal:
    name: ${AUDIO_NETWORK:-audio-internal}
    external: true
